; ============================================================
;  MapSizeExt configuration
;  Place this file in your Yuri's Revenge game directory,
;  alongside MapSizeExt.dll, and inject the DLL with Syringe.
;
;  Every patch is byte-verified before it is written and is
;  skipped on mismatch, so an unexpected game build degrades
;  gracefully instead of corrupting code. Progress is written
;  to MapSizeExt.log in the game directory -- read it first if
;  anything looks wrong.
; ============================================================
;
;  STRIDE = the internal cell-grid width. Vanilla is 512, which
;  caps a map at W+H <= 512 (a ~256x256 square). The stride must
;  be a power of two and must exceed W+H of any map you load.
;
;     Stride  Max W+H   Practical square   Notes
;     512     512       ~256x256           vanilla, DLL is a no-op
;     1024    1024      ~500x500           no other changes needed
;     2048    2048      ~1000x1000         see LargeAddressAware below
;
;  LARGE MAPS AND MEMORY: the cell objects for a big map do not
;  fit in the 2 GB address space a 32-bit process gets by default.
;  Beyond roughly 600x600 you must set the LargeAddressAware bit
;  on gamemd.exe / gamemd-spawn.exe (PE Characteristics |= 0x20),
;  which raises the limit to ~4 GB on a 64-bit OS. Without it a
;  700x700+ map will run out of memory during load.
;
;  ANTARES / PHOBOS: no custom build of either is required.
;  MapSizeExt patches their compiled-in cell math in memory at
;  load time, and also scans every other DLL in the game folder
;  for the same pattern, so co-loaded extension DLLs stay correct.

[MapSize]
; Grid stride width (power of two). 512 = vanilla / no-op.
Stride=2048

; Per-axis dimension gate. The engine rejects a map when a side
; reaches this value. Keep it equal to Stride.
MaxDimension=2048
MaxWidth=2048
MaxHeight=2048

; ============================================================
;  [Debug] -- every patch group can be disabled independently,
;  which makes bisecting a problem a config change rather than
;  a rebuild. Defaults are the shipped, tested configuration.
; ============================================================
[Debug]
PatchStride=1        ; cell-index shl sites (the core of the expansion)
PatchBounds=1        ; cell-array size limits (0x40000 -> stride^2)
PatchBoundsCmp=1     ; the inlined bounds compares
PatchRootWH=1        ; root cell-array allocation dimensions
PatchModules=1       ; Antares/Phobos/other DLL cell math (leave ON:
                     ; with this off they index a stride-2048 array
                     ; using 512, silently hitting the wrong cells)
PatchCoord=1         ; inverse index -> (X,Y) conversions
PatchAdjacency=1     ; 8-neighbour cell offset table
PatchIterator=1      ; full-map cell iterator bounds
PatchRadar=1         ; radar surface sizing (auto: only enlarged when
                     ; the map needs it; normal maps stay vanilla)
PatchSubzone=1       ; pathfinding zone block scale + unsigned zone IDs
PatchCrashGuard=1    ; defensive guards on known big-map crash paths
PatchGuard=0         ; experimental render-path guard (off)
PatchIso=0           ; experimental tactical iso sites (off)

; Antares re-sorts its INI index once per parsed line, which costs
; minutes on a map with ~100k [IsoMapPack5] lines. This disables
; that one hook for BIG maps only; normal maps keep stock Antares.
AntaresIniFix=1

; Per-call trace logging (orders, paths, cell decodes). Very noisy
; and writes to disk constantly -- only enable when diagnosing.
DiagVerbose=0
