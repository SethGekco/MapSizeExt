; MapSizeExt configuration
; Place this file in your Yuri's Revenge game directory
; alongside MapSizeExt.dll.
;
; IMPORTANT: Do NOT change PlaneScale above 1 until all hook
; sites are confirmed working. Start with scale 1 to verify the
; DLL loads cleanly (check MapSizeExt.log in the game dir).
; Then try scale 2 on a small test map.
;
; Supported runtime scales: 1 -> stock, 2 -> up to 512x512,
; 4 -> up to 1024x1024 (research; still needs runtime validation).

[MapSize]
; Preferred single geometry authority. It derives Stride=512*PlaneScale and,
; when omitted below, MaxDimension=Stride and MaxWidth/MaxHeight=Stride/2.
PlaneScale=1

; Legacy alternative. Do not set this with PlaneScale unless they agree.
;Stride=512

; Maximum map width in cells
;MaxWidth=512

; Maximum map height in cells
;MaxHeight=512

; Per-axis dimension gate: replaces the hardcoded cmp ax,0x200 checks.
; MapSizeExt also requires W+H <= the derived Stride so diamond coordinates
; fit the widened cell plane.
; To allow e.g. 400x400 maps: set this to 512 (no change needed, the
; engine already allows it - just use MapResize to create the map file).
; PlaneScale derives this automatically; legacy Stride users must increase both.
;MaxDimension=512
