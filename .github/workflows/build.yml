name: Build MapSizeExt

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Check Syringe hooks
      shell: bash
      run: |
        curl -sSfL -o hooks.csv \
          https://raw.githubusercontent.com/SethGekco/YR-Hook-Encyclopedia/main/registry/hooks.csv
        python3 tools/check_hook_overlap.py hooks.csv src
        python3 tools/check_hook_bounds.py --registry hooks.csv src

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Release
      run: |
        msbuild MapSizeExt.vcxproj `
          /p:Configuration=Release `
          /p:Platform=Win32 `
          /p:SolutionDir="${{ github.workspace }}\" `
          /m

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MapSizeExt
        path: bin/Release/MapSizeExt.dll
        if-no-files-found: error
